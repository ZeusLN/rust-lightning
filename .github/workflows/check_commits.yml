name: CI check_commits

on:
  pull_request:
    branches-ignore:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_commits:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: 1.96.1
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust ${{ env.TOOLCHAIN }} toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile=minimal --default-toolchain ${{ env.TOOLCHAIN }}
      # ZEUS fork: PRs target fork branches (zeus-0.3-rc3, ...) that do not
      # exist upstream, so check each commit against the fork's base.
      - name: For each commit, run cargo check (including in fuzz)
        run: |
          export GIT_COMMITTER_EMAIL="rl-ci@example.com"
          export GIT_COMMITTER_NAME="RL CI"
          ci/check-each-commit.sh origin/${{ github.base_ref }}
