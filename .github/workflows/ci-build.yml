name: CI Build Job

on:
  workflow_call:
    inputs:
      script:
        description: CI script to run (relative to repo root)
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ZEUS fork: GitHub-hosted runners (upstream's self-hosted ones do not
        # exist here) and pinned toolchains: 1.96.1 is the rustc zeus-vls
        # builds with (bump both together), next to the 1.75.0 MSRV.
        platform: [ ubuntu-latest, windows-latest, macos-latest ]
        toolchain: [ 1.96.1, 1.75.0 ]
        exclude:
          - platform: windows-latest
            toolchain: 1.75.0
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install Rust ${{ matrix.toolchain }} toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile=minimal --default-toolchain ${{ matrix.toolchain }}
      - name: Use rust-lld linker on Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "RUSTFLAGS=-C linker=rust-lld" >> "$GITHUB_ENV"
      - name: Set RUSTFLAGS to deny warnings
        if: "matrix.toolchain == '1.75.0'"
        run: echo "RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"
      - name: Install no-std-check dependencies for ARM Embedded
        if: matrix.platform == 'ubuntu-latest'
        run: |
          rustup target add thumbv7m-none-eabi
      - name: Enable caching for bitcoind
        if: matrix.platform != 'windows-latest'
        id: cache-bitcoind
        uses: actions/cache@v4
        with:
          path: bin/bitcoind-${{ runner.os }}-${{ runner.arch }}
          key: bitcoind-${{ runner.os }}-${{ runner.arch }}
      - name: Enable caching for electrs
        if: matrix.platform != 'windows-latest'
        id: cache-electrs
        uses: actions/cache@v4
        with:
          path: bin/electrs-${{ runner.os }}-${{ runner.arch }}
          key: electrs-${{ runner.os }}-${{ runner.arch }}
      - name: Download bitcoind/electrs
        if: >-
          matrix.platform != 'windows-latest'
          && (steps.cache-bitcoind.outputs.cache-hit != 'true'
          || steps.cache-electrs.outputs.cache-hit != 'true')
        run: |
            source ./contrib/download_bitcoind_electrs.sh
            mkdir bin
            mv "$BITCOIND_EXE" bin/bitcoind-${{ runner.os }}-${{ runner.arch }}
            mv "$ELECTRS_EXE" bin/electrs-${{ runner.os }}-${{ runner.arch }}
      - name: Set bitcoind/electrs environment variables
        if: matrix.platform != 'windows-latest'
        run: |
            echo "BITCOIND_EXE=$( pwd )/bin/bitcoind-${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_ENV"
            echo "ELECTRS_EXE=$( pwd )/bin/electrs-${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_ENV"
      - name: Run CI script
        shell: bash
        run: CI_ENV=1 CI_MINIMIZE_DISK_USAGE=1 ./${{ inputs.script }}
