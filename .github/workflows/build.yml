name: Continuous Integration Checks

# ZEUS fork: upstream runs several jobs on its own self-hosted runners,
# which this repository does not have (those jobs waited 24h and
# failed). They run on ubuntu-latest here. The coverage job is dropped:
# it only uploaded to upstream's Codecov project.
#
# Toolchains are pinned: 1.96.1 (the rustc zeus-vls builds with; bump
# both together) in place of upstream's stable and beta, plus the MSRVs.
# New releases add lints and break old dependencies (rustc 1.100 cannot
# build the lightning 0.0.125 that lightning-tests uses), which says
# nothing about the code ZEUS ships.

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches-ignore:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ext-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install Rust 1.96.1 toolchain
        run: |
          rustup default 1.96.1
      - name: Run externalized tests
        run: |
          cd ext-functional-test-demo
          cargo test --verbose --color always
          cargo test --verbose --color always --features test-broken
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-latest, windows-latest, macos-latest ]
        toolchain: [ 1.96.1, 1.63.0 ] # 1.63.0 is the MSRV for all crates but `lightning-transaction-sync`.
        exclude:
          - platform: windows-latest
            toolchain: 1.63.0
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install Rust ${{ matrix.toolchain }} toolchain
        run: |
          rustup default ${{ matrix.toolchain }}
      - name: Use rust-lld linker on Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "RUSTFLAGS=-C linker=rust-lld" >> "$GITHUB_ENV"
      - name: Install no-std-check dependencies for ARM Embedded
        if: "matrix.platform == 'ubuntu-latest'"
        run: |
          rustup target add thumbv7m-none-eabi
      - name: shellcheck the CI and `contrib` scripts
        if: "matrix.platform == 'ubuntu-latest'"
        run: |
          shellcheck ci/*.sh -aP ci
          shellcheck contrib/*.sh -aP contrib
      - name: Set RUSTFLAGS to deny warnings
        if: "matrix.toolchain == '1.63.0'"
        run: echo "RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"
      - name: Run CI script
        shell: bash # Default on Winblows is powershell
        run: CI_ENV=1 CI_MINIMIZE_DISK_USAGE=1 ./ci/ci-tests.sh

  build-tx-sync:
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-latest, macos-latest ]
        toolchain: [ 1.96.1, 1.75.0 ] # 1.75.0 is the MSRV for `lightning-transaction-sync`.
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install Rust ${{ matrix.toolchain }} toolchain
        run: |
          rustup default ${{ matrix.toolchain }}
      - name: Set RUSTFLAGS to deny warnings
        if: "matrix.toolchain == '1.75.0'"
        run: echo "RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"
      - name: Enable caching for bitcoind
        id: cache-bitcoind
        uses: actions/cache@v4
        with:
          path: bin/bitcoind-${{ runner.os }}-${{ runner.arch }}
          key: bitcoind-${{ runner.os }}-${{ runner.arch }}
      - name: Enable caching for electrs
        id: cache-electrs
        uses: actions/cache@v4
        with:
          path: bin/electrs-${{ runner.os }}-${{ runner.arch }}
          key: electrs-${{ runner.os }}-${{ runner.arch }}
      - name: Download bitcoind/electrs
        if: "steps.cache-bitcoind.outputs.cache-hit != 'true' || steps.cache-electrs.outputs.cache-hit != 'true'"
        run: |
            source ./contrib/download_bitcoind_electrs.sh
            mkdir bin
            mv "$BITCOIND_EXE" bin/bitcoind-${{ runner.os }}-${{ runner.arch }}
            mv "$ELECTRS_EXE" bin/electrs-${{ runner.os }}-${{ runner.arch }}
      - name: Set bitcoind/electrs environment variables
        run: |
            echo "BITCOIND_EXE=$( pwd )/bin/bitcoind-${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_ENV"
            echo "ELECTRS_EXE=$( pwd )/bin/electrs-${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_ENV"
      - name: Run CI script
        shell: bash # Default on Winblows is powershell
        run: CI_ENV=1 CI_MINIMIZE_DISK_USAGE=1 ./ci/ci-tx-sync-tests.sh

  benchmark:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: 1.96.1
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install Rust ${{ env.TOOLCHAIN }} toolchain
        run: |
          rustup default ${{ env.TOOLCHAIN }}
      - name: Cache routing graph snapshot
        id: cache-graph
        uses: actions/cache@v4
        with:
          path: lightning/net_graph-2023-12-10.bin
          key: ldk-net_graph-v0.0.118-2023-12-10.bin
      - name: Fetch routing graph snapshot
        if: steps.cache-graph.outputs.cache-hit != 'true'
        run: |
          curl --verbose -L -o lightning/net_graph-2023-12-10.bin https://bitcoin.ninja/ldk-net_graph-v0.0.118-2023-12-10.bin
          echo "Sha sum: $(sha256sum lightning/net_graph-2023-12-10.bin | awk '{ print $1 }')"
          if [ "$(sha256sum lightning/net_graph-2023-12-10.bin | awk '{ print $1 }')" != "${EXPECTED_ROUTING_GRAPH_SNAPSHOT_SHASUM}" ]; then
            echo "Bad hash"
            exit 1
          fi
        env:
          EXPECTED_ROUTING_GRAPH_SNAPSHOT_SHASUM: e94b38ef4b3ce683893bf6a3ee28d60cb37c73b059403ff77b7e7458157968c2
      - name: Cache scorer snapshot
        id: cache-scorer
        uses: actions/cache@v4
        with:
          path: lightning/scorer-2023-12-10.bin
          key: ldk-scorer-v0.0.118-2023-12-10.bin
      - name: Fetch scorer snapshot
        if: steps.cache-scorer.outputs.cache-hit != 'true'
        run: |
          curl --verbose -L -o lightning/scorer-2023-12-10.bin https://bitcoin.ninja/ldk-scorer-v0.0.118-2023-12-10.bin
          echo "Sha sum: $(sha256sum lightning/scorer-2023-12-10.bin | awk '{ print $1 }')"
          if [ "$(sha256sum lightning/scorer-2023-12-10.bin | awk '{ print $1 }')" != "${EXPECTED_SCORER_SNAPSHOT_SHASUM}" ]; then
            echo "Bad hash"
            exit 1
          fi
        env:
          EXPECTED_SCORER_SNAPSHOT_SHASUM: 570a26bb28870fe1da7e392cdec9fb794718826b04c43ca053d71a8a9bb9be69
      - name: Fetch rapid graph sync reference input
        run: |
          curl --verbose -L -o lightning-rapid-gossip-sync/res/full_graph.lngossip https://bitcoin.ninja/ldk-compressed_graph-285cb27df79-2022-07-21.bin
          echo "Sha sum: $(sha256sum lightning-rapid-gossip-sync/res/full_graph.lngossip | awk '{ print $1 }')"
          if [ "$(sha256sum lightning-rapid-gossip-sync/res/full_graph.lngossip | awk '{ print $1 }')" != "${EXPECTED_RAPID_GOSSIP_SHASUM}" ]; then
            echo "Bad hash"
            exit 1
          fi
        env:
          EXPECTED_RAPID_GOSSIP_SHASUM: e0f5d11641c11896d7af3a2246d3d6c3f1720b7d2d17aab321ecce82e6b7deb8
      - name: Test with Network Graph on Rust ${{ matrix.toolchain }}
        run: |
          cd lightning
          RUSTFLAGS="--cfg=require_route_graph_test" cargo test
          cd ..
      - name: Run benchmarks on Rust ${{ matrix.toolchain }}
        run: |
          cd bench
          RUSTFLAGS="--cfg=ldk_bench --cfg=require_route_graph_test" cargo bench

  check_release:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: 1.96.1
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust ${{ env.TOOLCHAIN }} toolchain
        run: |
          rustup default ${{ env.TOOLCHAIN }}
      - name: Run cargo check for release build.
        run: |
          cargo check --release
          cargo check --no-default-features --features=std --release
          cargo doc --release
      - name: Run cargo check for Taproot build.
        run: |
          cargo check --release
          cargo check --no-default-features --release
          cargo check --no-default-features --features=std --release
          cargo doc --release
          cargo doc --no-default-features --release
        env:
          RUSTFLAGS: '--cfg=taproot'
          RUSTDOCFLAGS: '--cfg=taproot'

  check_docs:
    runs-on: ubuntu-latest
    env:
      # While docs.rs builds using a nightly compiler (and we use some nightly features),
      # nightly ends up randomly breaking builds occasionally, so we instead use a
      # pinned release (ZEUS fork: upstream uses beta) and set RUSTC_BOOTSTRAP in
      # check-docsrs.sh
      TOOLCHAIN: 1.96.1
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust ${{ env.TOOLCHAIN }} toolchain
        run: |
          rustup default ${{ env.TOOLCHAIN }}
      - name: Simulate docs.rs build
        run: ci/check-docsrs.sh

  fuzz:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: 1.63
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install Rust ${{ env.TOOLCHAIN }} toolchain
        run: |
          rustup default ${{ env.TOOLCHAIN }}
      - name: Pin the syn and regex dependencies
        run: |
          cd fuzz && cargo update -p regex --precise "1.9.6" && cargo update -p serde --precise "1.0.228" && cargo update -p syn --precise "2.0.106" && cargo update -p quote --precise "1.0.41"
          cargo update -p proc-macro2 --precise "1.0.103" --verbose && cargo update -p serde_json --precise "1.0.145" --verbose
          cargo update -p itoa --precise "1.0.15" --verbose && cargo update -p ryu --precise "1.0.20" --verbose
          cargo update -p libc --precise 0.2.183
          cargo update -p unicode-ident --precise 1.0.22
          cargo update -p honggfuzz --precise 0.5.59
          cargo update -p semver --precise 1.0.27
          cargo update -p cc --precise "1.4.0" --verbose
          cargo update -p find-msvc-tools --precise "0.1.9" --verbose

          cd write-seeds && cargo update -p regex --precise "1.9.6" && cargo update -p serde --precise "1.0.228" && cargo update -p syn --precise "2.0.106" && cargo update -p quote --precise "1.0.41"
          cargo update -p proc-macro2 --precise "1.0.103" --verbose && cargo update -p serde_json --precise "1.0.145" --verbose
          cargo update -p itoa --precise "1.0.15" --verbose && cargo update -p ryu --precise "1.0.20" --verbose
          cargo update -p libc --precise 0.2.183
          cargo update -p unicode-ident --precise 1.0.22
          cargo update -p cc --precise "1.4.0" --verbose
          cargo update -p find-msvc-tools --precise "0.1.9" --verbose
      - name: Sanity check fuzz targets on Rust ${{ env.TOOLCHAIN }}
        run: |
          cd fuzz
          RUSTFLAGS="--cfg=fuzzing --cfg=secp256k1_fuzz --cfg=hashes_fuzz" cargo test --verbose --color always --lib --bins -j8
          cargo clean
      - name: Install honggfuzz build dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils-dev libunwind-dev
      - name: Run fuzzers
        run: cd fuzz && ./ci-fuzz.sh && cd ..

  linting:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: 1.96.1
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install Rust ${{ env.TOOLCHAIN }} toolchain
        run: |
          rustup default ${{ env.TOOLCHAIN }}
      - name: Install clippy
        run: |
          rustup component add clippy
      - name: Run default clippy linting
        run: |
          ./ci/check-lint.sh

  rustfmt:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: 1.63.0
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install Rust ${{ env.TOOLCHAIN }} toolchain
        run: |
          rustup default ${{ env.TOOLCHAIN }}
      - name: Install rustfmt
        run: |
          rustup component add rustfmt
      - name: Run rustfmt checks
        run: cargo fmt --check
      - name: Run rustfmt checks on lightning-tests
        run: cd lightning-tests && cargo fmt --check
